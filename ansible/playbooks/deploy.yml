---
# Send the manifests in k8s/ to the control plane and apply them.
# kubectl from a laptop would need the API port (6443) open to the internet;
# this uses the SSH connection Ansible already has.
- name: Deploy applications to the cluster
  hosts: k3s_server
  become: true
  vars:
    deploy_remote_dir: /opt/k8s
    deploy_apps_dir: "{{ playbook_dir }}/../../k8s"
  tasks:
    - name: Create the manifests directory on the server
      ansible.builtin.file:
        path: "{{ deploy_remote_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy the manifests to the server
      ansible.builtin.copy:
        src: "{{ deploy_apps_dir }}/"
        dest: "{{ deploy_remote_dir }}/"
        owner: root
        group: root
        mode: "0644"

    - name: Apply the manifests
      ansible.builtin.command: /usr/local/bin/k3s kubectl apply -R -f {{ deploy_remote_dir }}
      register: deploy_apply
      changed_when: "'created' in deploy_apply.stdout or 'configured' in deploy_apply.stdout"
      when: not ansible_check_mode

    - name: Show what was applied
      ansible.builtin.debug:
        msg: "{{ deploy_apply.stdout_lines }}"
      when: not ansible_check_mode
