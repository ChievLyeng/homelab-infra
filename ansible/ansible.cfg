[defaults]
roles_path          = roles
retry_files_enabled = False
interpreter_python  = auto_silent
# Quieter, readable output.
callback_result_format = yaml

[ssh_connection]
pipelining = True
# accept-new: trust a host's key the first time, refuse if it changes later.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/work/ansible/.ansible/known_hosts
