---
- name: Download the k3s installer
  ansible.builtin.get_url:
    url: "{{ k3s_install_url }}"
    dest: /usr/local/bin/k3s-install.sh
    owner: root
    group: root
    mode: "0755"

# The installer sets up the binary, a systemd service and starts it.
# `creates` makes this run only once: later runs skip it (idempotent).
- name: Install the k3s server
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s-install.sh
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: >-
      server
      --node-ip {{ ansible_facts['default_ipv4']['address'] }}
      --tls-san {{ ansible_host }}
      {% if k3s_server_taint_enabled %}--node-taint CriticalAddonsOnly=true:NoExecute{% endif %}
      {% for addon in k3s_server_disabled_addons %}--disable {{ addon }} {% endfor %}

- name: Wait for the server node to be Ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes --no-headers
  register: k3s_server_nodes
  until: "' Ready' in k3s_server_nodes.stdout"
  retries: 30
  delay: 5
  changed_when: false
  when: not ansible_check_mode

# Agents need this secret to join. It is read here and handed over by Ansible:
# nobody copies it by hand. no_log keeps it out of the console output.
- name: Read the node join token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_server_token_file
  no_log: true
  when: not ansible_check_mode

- name: Remember the join token for the agents
  ansible.builtin.set_fact:
    k3s_server_node_token: "{{ k3s_server_token_file.content | b64decode | trim }}"
  no_log: true
  when: not ansible_check_mode

# ---- kubectl from your own machine -------------------------------------------
- name: Fetch the kubeconfig to the controller
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ k3s_server_kubeconfig_dest }}"
    flat: true
  no_log: true
  when: k3s_server_fetch_kubeconfig | bool and not ansible_check_mode

- name: Point the kubeconfig at the server's address and restrict it
  ansible.builtin.replace:
    path: "{{ k3s_server_kubeconfig_dest }}"
    regexp: "https://127\\.0\\.0\\.1:6443"
    replace: "https://{{ ansible_host }}:6443"
    mode: "0600"
  delegate_to: localhost
  become: false
  when: k3s_server_fetch_kubeconfig | bool and not ansible_check_mode
